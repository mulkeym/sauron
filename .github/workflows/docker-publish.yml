# Build the SAURON Docker image and publish to GitHub Container Registry (GHCR).
#
# Platform: linux/amd64 only (x86_64 servers).
#
# Images:
#   ghcr.io/mulkeym/sauron:latest          (default branch)
#   ghcr.io/mulkeym/sauron:<branch>        (other branches)
#   ghcr.io/mulkeym/sauron:sha-<short>     (every push that publishes)
#   ghcr.io/mulkeym/sauron:1.2.3           (git tag v1.2.3)
#
# First-time package visibility (public repo):
#   https://github.com/users/mulkeym/packages/container/sauron/settings
#   → Change package visibility to Public if anonymous pulls are required.
#
# Pull:
#   docker pull ghcr.io/mulkeym/sauron:latest
#   # private package:
#   echo $GITHUB_TOKEN | docker login ghcr.io -u USERNAME --password-stdin

name: Docker

on:
  push:
    branches: ["master", "main"]
    tags: ["v*"]
  pull_request:
    branches: ["master", "main"]
  workflow_dispatch:

# Cancel superseded runs on the same ref (saves build minutes).
concurrency:
  group: docker-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  # GHCR requires lowercase image names
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-and-push:
    name: Build, verify, and publish
    runs-on: ubuntu-latest
    # HF model bake can be slow on a cold cache
    timeout-minutes: 120
    permissions:
      contents: read
      packages: write
      # Required for private repos when using GITHUB_TOKEN with some orgs
      attestations: write
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare build tools and disk space
        run: |
          # Hosted-runner SDKs are not used by this Python container build.
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends skopeo
          df -h /

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract image metadata (tags, labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            # Semver from git tags: v1.2.3 → 1.2.3, 1.2, 1
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            # Default branch → latest
            type=raw,value=latest,enable={{is_default_branch}}
            # Branch name (sanitized)
            type=ref,event=branch
            # Short git SHA on every publish
            type=sha,prefix=sha-,format=short

      - name: Build production OCI artifact
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64
          # Build once. Release tags are written only after every check passes.
          push: false
          outputs: type=oci,dest=${{ runner.temp }}/sauron-oci,tar=false,compression=gzip
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          # Final-image layers are reusable. Avoid exporting the deliberately
          # disposable unsplit builder/model stages to GitHub's cache.
          cache-to: type=gha,mode=min
          provenance: mode=max
          sbom: true

      - name: Enforce sub-1 GB OCI layers
        run: |
          python3 scripts/check_oci_layer_sizes.py "$RUNNER_TEMP/sauron-oci" \
            --max-bytes 1000000000 --platform linux/amd64 \
            --report "$RUNNER_TEMP/layer-sizes.json"

      - name: Load verified production image
        run: |
          skopeo --override-os linux --override-arch amd64 copy \
            "oci:$RUNNER_TEMP/sauron-oci" docker-daemon:sauron-ci:checked

      - name: Check packaged runtime and offline startup
        run: bash scripts/check_packaged_runtime.sh sauron-ci:checked

      - name: Run regression tests against packaged source
        run: |
          docker run --rm --network none --entrypoint bash \
            -v "$GITHUB_WORKSPACE:/release:ro" sauron-ci:checked -euc '
              mkdir -p /tmp/release-tests /app/tests
              cp -a /release/tests/. /app/tests/
              cd /tmp/release-tests
              cp -a /release/tests /release/test_fixtures /release/docs /release/.github .
              cp /release/Dockerfile /release/.env.example /release/requirements.txt /release/constraints-security.txt .
              ln -s /app/scripts scripts
              ln -s /app/src src
              PYTHONPATH=/app:/tmp/release-tests python -m pytest tests -q
            '

      - name: Publish the verified artifact
        if: github.event_name != 'pull_request'
        env:
          IMAGE_TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          set -euo pipefail
          while IFS= read -r tag; do
            [ -n "$tag" ] || continue
            skopeo copy --all --preserve-digests \
              --authfile "$HOME/.docker/config.json" \
              --digestfile "$RUNNER_TEMP/published-digest.txt" \
              "oci:$RUNNER_TEMP/sauron-oci" "docker://$tag"
          done <<< "$IMAGE_TAGS"

      - name: Save verification reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: image-verification
          path: |
            ${{ runner.temp }}/layer-sizes.json
            ${{ runner.temp }}/sauron-release-startup.log
            ${{ runner.temp }}/published-digest.txt

      - name: Image summary
        if: success()
        env:
          IMAGE_TAGS: ${{ steps.meta.outputs.tags }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          {
            echo "### Verified linux/amd64 image"
            echo '```json'
            cat "$RUNNER_TEMP/layer-sizes.json"
            echo '```'
            if [ "$EVENT_NAME" != pull_request ]; then
              echo "Published tags:"
              echo '```'
              printf '%s\n' "$IMAGE_TAGS"
              cat "$RUNNER_TEMP/published-digest.txt"
              echo '```'
            else
              echo "Pull request validation only; no image tags published."
            fi
          } >> "$GITHUB_STEP_SUMMARY"
