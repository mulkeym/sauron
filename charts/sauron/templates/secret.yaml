{{- if not .Values.secrets.existingSecret }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "sauron.secretName" . }}
  labels:
    {{- include "sauron.labels" . | nindent 4 }}
type: Opaque
stringData:
  JWT_SECRET_KEY: {{ .Values.secrets.jwtSecretKey | quote }}
  API_KEYS: {{ .Values.secrets.apiKeys | quote }}
  ADMIN_USERNAME: {{ .Values.secrets.adminUsername | quote }}
  ADMIN_PASSWORD: {{ .Values.secrets.adminPassword | quote }}
  VLLM_API_KEY: {{ .Values.secrets.vllmApiKey | quote }}
  MCP_OPENWEBUI_JWT_SECRET: {{ .Values.secrets.mcpOpenwebuiJwtSecret | quote }}
  {{- range $key, $value := .Values.secrets.extra }}
  {{ $key }}: {{ $value | quote }}
  {{- end }}
{{- end }}
