{{- if .Values.imagePullSecretsCreate.enabled }}
{{- $name := .Values.imagePullSecretsCreate.name | required "imagePullSecretsCreate.name is required when enabled" }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  labels:
    {{- include "sauron.labels" . | nindent 4 }}
type: kubernetes.io/dockerconfigjson
data:
  {{- if .Values.imagePullSecretsCreate.dockerconfigjson }}
  .dockerconfigjson: {{ .Values.imagePullSecretsCreate.dockerconfigjson | quote }}
  {{- else }}
  {{- $registry := .Values.imagePullSecretsCreate.registry | required "imagePullSecretsCreate.registry is required when not providing dockerconfigjson" }}
  {{- $username := .Values.imagePullSecretsCreate.username | required "imagePullSecretsCreate.username is required when not providing dockerconfigjson" }}
  {{- $password := .Values.imagePullSecretsCreate.password | required "imagePullSecretsCreate.password is required when not providing dockerconfigjson" }}
  {{- $email := .Values.imagePullSecretsCreate.email | default "" }}
  {{- $auth := printf "%s:%s" $username $password | b64enc }}
  {{- $dockerConfig := dict "auths" (dict $registry (dict "username" $username "password" $password "email" $email "auth" $auth)) }}
  .dockerconfigjson: {{ $dockerConfig | toJson | b64enc | quote }}
  {{- end }}
{{- end }}
