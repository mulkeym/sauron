# Shared build configuration (MITM/air-gap friendly args from .env).
# Place certs/Trusted_Root_CAs.pem (inspection CA) before: docker compose build
x-sauron-build: &sauron-build
  context: .
  dockerfile: Dockerfile
  args:
    # Forward proxy (if not transparent MITM)
    HTTP_PROXY: ${HTTP_PROXY:-}
    HTTPS_PROXY: ${HTTPS_PROXY:-}
    NO_PROXY: ${NO_PROXY:-}
    http_proxy: ${HTTP_PROXY:-}
    https_proxy: ${HTTPS_PROXY:-}
    no_proxy: ${NO_PROXY:-}
    # Private PyPI / torch mirror (optional)
    PIP_INDEX_URL: ${PIP_INDEX_URL:-}
    PIP_EXTRA_INDEX_URL: ${PIP_EXTRA_INDEX_URL:-}
    # Skip TLS verify for these hosts during pip (MITM). Space-separated.
    PIP_TRUSTED_HOST: ${PIP_TRUSTED_HOST:-pypi.org files.pythonhosted.org pypi.python.org pythonhosted.org download.pytorch.org}
    TORCH_CPU_INDEX: ${TORCH_CPU_INDEX:-https://download.pytorch.org/whl/cpu}
    # Hugging Face model bake — required for offline runtime (do not skip in prod)
    SAURON_PREFETCH_INSECURE_SSL: ${SAURON_PREFETCH_INSECURE_SSL:-1}
    SKIP_PDF_MODEL_PREFETCH: ${SKIP_PDF_MODEL_PREFETCH:-0}
    SKIP_HF_MODEL_PREFETCH: ${SKIP_HF_MODEL_PREFETCH:-0}
    SAURON_PREFETCH_ALLOW_FAIL: ${SAURON_PREFETCH_ALLOW_FAIL:-0}
    EMBEDDING_MODEL_NAME: ${EMBEDDING_MODEL_NAME:-nomic-ai/nomic-embed-text-v1}
    RERANK_MODEL: ${RERANK_MODEL:-cross-encoder/ms-marco-MiniLM-L-6-v2}
    # Artifactory / corporate HF mirror (huggingface_hub uses these during bake)
    # HF_ENDPOINT=https://artifactory.example.com/artifactory/api/huggingfaceml/huggingface-remote
    HF_ENDPOINT: ${HF_ENDPOINT:-}
    HF_TOKEN: ${HF_TOKEN:-}
    HUGGING_FACE_HUB_TOKEN: ${HUGGING_FACE_HUB_TOKEN:-${HF_TOKEN:-}}

services:
  # SAURON API + Admin UI + native MCP Streamable HTTP endpoint
  api:
    image: sauron:local
    build: *sauron-build
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "8880:8080"
    environment:
      - VLLM_BASE_URL=${VLLM_BASE_URL:-http://host.docker.internal:8000/v1}
      - VLLM_MODEL_NAME=${VLLM_MODEL_NAME:-google/gemma-4-31b-it}
      - VLLM_REQUEST_TIMEOUT=${VLLM_REQUEST_TIMEOUT:-300}
      - EMBEDDING_MODE=${EMBEDDING_MODE:-local}
      - EMBEDDING_API_URL=${EMBEDDING_API_URL:-http://host.docker.internal:8000/v1}
      - EMBEDDING_MODEL_NAME=${EMBEDDING_MODEL_NAME:-nomic-ai/nomic-embed-text-v1}
      - LANCEDB_PATH=/app/data/lancedb
      - LANCEDB_TABLE_NAME=${LANCEDB_TABLE_NAME:-chunks}
      - JWT_SECRET_KEY=${JWT_SECRET_KEY:-change-me-in-production}
      - API_KEYS=${API_KEYS:-dev-key-1}
      - MCP_ENABLED=${MCP_ENABLED:-true}
      - MCP_PATH=${MCP_PATH:-/mcp}
      - MCP_STATELESS_HTTP=${MCP_STATELESS_HTTP:-true}
      - MCP_OPENWEBUI_JWT_SECRET=${MCP_OPENWEBUI_JWT_SECRET:-}
      - MCP_OPENWEBUI_GROUPS_HEADER=${MCP_OPENWEBUI_GROUPS_HEADER:-X-Sauron-User-Groups}
      - MCP_OPENWEBUI_ALLOW_ALL_GROUP=${MCP_OPENWEBUI_ALLOW_ALL_GROUP:-false}
      - SSL_VERIFY=${SSL_VERIFY:-true}
      - DATABASE_URL=sqlite+aiosqlite:///./data/metadata.db
      - HTTP_PROXY=${HTTP_PROXY:-}
      - HTTPS_PROXY=${HTTPS_PROXY:-}
      - NO_PROXY=${NO_PROXY:-}
    volumes:
      - app_data:/app/data
    restart: unless-stopped

volumes:
  app_data:
