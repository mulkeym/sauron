services:
  # SAURON API + Admin UI
  api:
    build: .
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "8880:8080"
    environment:
      - VLLM_BASE_URL=${VLLM_BASE_URL:-http://host.docker.internal:8000/v1}
      - VLLM_MODEL_NAME=${VLLM_MODEL_NAME:-google/gemma-4-31b-it}
      - VLLM_REQUEST_TIMEOUT=${VLLM_REQUEST_TIMEOUT:-300}
      - EMBEDDING_MODE=${EMBEDDING_MODE:-local}
      - EMBEDDING_API_URL=${EMBEDDING_API_URL:-http://host.docker.internal:8000/v1}
      - EMBEDDING_MODEL_NAME=${EMBEDDING_MODEL_NAME:-nomic-ai/nomic-embed-text-v1}
      - LANCEDB_PATH=/app/data/lancedb
      - LANCEDB_TABLE_NAME=${LANCEDB_TABLE_NAME:-chunks}
      - JWT_SECRET_KEY=${JWT_SECRET_KEY:-change-me-in-production}
      - API_KEYS=${API_KEYS:-dev-key-1}
      - SSL_VERIFY=${SSL_VERIFY:-true}
      - DATABASE_URL=sqlite+aiosqlite:///./data/metadata.db
    volumes:
      - app_data:/app/data
    restart: unless-stopped

  # MCP Server (SSE transport for direct MCP clients)
  mcp:
    build: .
    extra_hosts:
      - "host.docker.internal:host-gateway"
    command: ["python", "-m", "src.mcp.run"]
    ports:
      - "8890:8090"
    environment:
      - VLLM_BASE_URL=${VLLM_BASE_URL:-http://host.docker.internal:8000/v1}
      - VLLM_MODEL_NAME=${VLLM_MODEL_NAME:-google/gemma-4-31b-it}
      - VLLM_REQUEST_TIMEOUT=${VLLM_REQUEST_TIMEOUT:-300}
      - EMBEDDING_MODE=${EMBEDDING_MODE:-local}
      - EMBEDDING_API_URL=${EMBEDDING_API_URL:-http://host.docker.internal:8000/v1}
      - EMBEDDING_MODEL_NAME=${EMBEDDING_MODEL_NAME:-nomic-ai/nomic-embed-text-v1}
      - LANCEDB_PATH=/app/data/lancedb
      - LANCEDB_TABLE_NAME=${LANCEDB_TABLE_NAME:-chunks}
      - JWT_SECRET_KEY=${JWT_SECRET_KEY:-change-me-in-production}
      - API_KEYS=${API_KEYS:-dev-key-1}
      - SSL_VERIFY=${SSL_VERIFY:-true}
      - DATABASE_URL=sqlite+aiosqlite:///./data/metadata.db
      - MCP_PORT=8090
    volumes:
      - app_data:/app/data
    # Override the image's healthcheck (which targets the api on :8080). The MCP
    # server listens on :8090 with SSE transport and has no /api/health route, so
    # probe liveness instead: any HTTP response (even 404) proves it's serving.
    healthcheck:
      test: ["CMD-SHELL", "curl -s -o /dev/null http://localhost:8090/ || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 40s
    restart: unless-stopped

  # MCP-to-OpenAPI proxy (for OpenWebUI and REST clients)
  mcpo:
    build: .
    extra_hosts:
      - "host.docker.internal:host-gateway"
    entrypoint: ["mcpo", "--port", "8091", "--", "python", "-m", "src.mcp.run_stdio"]
    ports:
      - "8891:8091"
    environment:
      - VLLM_BASE_URL=${VLLM_BASE_URL:-http://host.docker.internal:8000/v1}
      - VLLM_MODEL_NAME=${VLLM_MODEL_NAME:-google/gemma-4-31b-it}
      - VLLM_REQUEST_TIMEOUT=${VLLM_REQUEST_TIMEOUT:-300}
      - EMBEDDING_MODE=${EMBEDDING_MODE:-local}
      - EMBEDDING_API_URL=${EMBEDDING_API_URL:-http://host.docker.internal:8000/v1}
      - EMBEDDING_MODEL_NAME=${EMBEDDING_MODEL_NAME:-nomic-ai/nomic-embed-text-v1}
      - LANCEDB_PATH=/app/data/lancedb
      - LANCEDB_TABLE_NAME=${LANCEDB_TABLE_NAME:-chunks}
      - JWT_SECRET_KEY=${JWT_SECRET_KEY:-change-me-in-production}
      - API_KEYS=${API_KEYS:-dev-key-1}
      - SSL_VERIFY=${SSL_VERIFY:-true}
      - DATABASE_URL=sqlite+aiosqlite:///./data/metadata.db
    volumes:
      - app_data:/app/data
    # Override the image's healthcheck (which targets the api on :8080). mcpo
    # serves the OpenAPI proxy on :8091; its /openapi.json returns 200.
    healthcheck:
      test: ["CMD-SHELL", "curl -fs -o /dev/null http://localhost:8091/openapi.json || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 40s
    restart: unless-stopped

volumes:
  app_data:
