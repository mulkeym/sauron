version: "3.9"
services:
  qdrant:
    image: qdrant/qdrant:v1.17.1
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage
    restart: unless-stopped

  vllm:
    image: vllm/vllm-openai:latest
    runtime: nvidia
    environment:
      - NVIDIA_VISIBLE_DEVICES=all
    command: >
      --model google/gemma-4-31b-it
      --max-model-len 32768
      --tensor-parallel-size 2
      --gpu-memory-utilization 0.9
    ports:
      - "8000:8000"
    volumes:
      - model_cache:/root/.cache/huggingface
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    restart: unless-stopped

  api:
    build: .
    ports:
      - "8080:8080"
    environment:
      - VLLM_BASE_URL=http://vllm:8000/v1
      - VLLM_MODEL_NAME=google/gemma-4-31b-it
      - EMBEDDING_MODEL_NAME=intfloat/e5-large-v2
      - EMBEDDING_DEVICE=cpu
      - QDRANT_HOST=qdrant
      - QDRANT_PORT=6333
      - QDRANT_COLLECTION_NAME=documents
      - JWT_SECRET_KEY=${JWT_SECRET_KEY:-change-me-in-production}
      - API_KEYS=${API_KEYS:-dev-key-1}
      - DATABASE_URL=sqlite+aiosqlite:///./data/metadata.db
    volumes:
      - api_data:/app/data
      - embedding_cache:/root/.cache/huggingface
    depends_on:
      - qdrant
      - vllm
    restart: unless-stopped

  # MCP Server (Knowledge Service for AI agents)
  mcp:
    build: .
    command: ["python", "-m", "src.mcp.run"]
    ports:
      - "8090:8090"
    environment:
      - VLLM_BASE_URL=http://vllm:8000/v1
      - VLLM_MODEL_NAME=google/gemma-4-31b-it
      - EMBEDDING_MODEL_NAME=intfloat/e5-large-v2
      - EMBEDDING_DEVICE=cpu
      - QDRANT_HOST=qdrant
      - QDRANT_PORT=6333
      - QDRANT_COLLECTION_NAME=documents
      - JWT_SECRET_KEY=${JWT_SECRET_KEY:-change-me-in-production}
      - API_KEYS=${API_KEYS:-dev-key-1}
      - DATABASE_URL=sqlite+aiosqlite:///./data/metadata.db
      - MCP_PORT=8090
    volumes:
      - api_data:/app/data
      - embedding_cache:/root/.cache/huggingface
    depends_on:
      - qdrant
      - vllm
    restart: unless-stopped

  open-webui:
    image: ghcr.io/open-webui/open-webui:v0.9.0
    ports:
      - "3000:8080"
    environment:
      - OPENAI_API_BASE_URL=http://api:8080/v1
      - OPENAI_API_KEY=dev-key-1
    volumes:
      - webui_data:/app/backend/data
    depends_on:
      - api
    restart: unless-stopped

volumes:
  qdrant_data:
  model_cache:
  api_data:
  embedding_cache:
  webui_data:
