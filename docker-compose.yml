version: "3.9"
services:
  # NOTE: vLLM (LLM inference) and embedding services run externally.
  # Configure VLLM_BASE_URL and EMBEDDING_API_URL in .env to point to your GPU servers.

  api:
    build: .
    ports:
      - "8080:8080"
    environment:
      - VLLM_BASE_URL=${VLLM_BASE_URL:-http://host.docker.internal:8000/v1}
      - VLLM_MODEL_NAME=${VLLM_MODEL_NAME:-google/gemma-4-31b-it}
      - EMBEDDING_MODE=${EMBEDDING_MODE:-api}
      - EMBEDDING_API_URL=${EMBEDDING_API_URL:-http://host.docker.internal:8000/v1}
      - EMBEDDING_MODEL_NAME=${EMBEDDING_MODEL_NAME:-intfloat/e5-large-v2}
      - LANCEDB_PATH=/app/data/lancedb
      - LANCEDB_TABLE_NAME=chunks
      - JWT_SECRET_KEY=${JWT_SECRET_KEY:-change-me-in-production}
      - API_KEYS=${API_KEYS:-dev-key-1}
      - DATABASE_URL=sqlite+aiosqlite:///./data/metadata.db
    volumes:
      - api_data:/app/data
    restart: unless-stopped

  # MCP Server (Knowledge Service for AI agents)
  mcp:
    build: .
    command: ["python", "-m", "src.mcp.run"]
    ports:
      - "8090:8090"
    environment:
      - VLLM_BASE_URL=${VLLM_BASE_URL:-http://host.docker.internal:8000/v1}
      - VLLM_MODEL_NAME=${VLLM_MODEL_NAME:-google/gemma-4-31b-it}
      - EMBEDDING_MODE=${EMBEDDING_MODE:-api}
      - EMBEDDING_API_URL=${EMBEDDING_API_URL:-http://host.docker.internal:8000/v1}
      - EMBEDDING_MODEL_NAME=${EMBEDDING_MODEL_NAME:-intfloat/e5-large-v2}
      - LANCEDB_PATH=/app/data/lancedb
      - LANCEDB_TABLE_NAME=chunks
      - JWT_SECRET_KEY=${JWT_SECRET_KEY:-change-me-in-production}
      - API_KEYS=${API_KEYS:-dev-key-1}
      - DATABASE_URL=sqlite+aiosqlite:///./data/metadata.db
      - MCP_PORT=8090
    volumes:
      - api_data:/app/data
    restart: unless-stopped

  open-webui:
    image: ghcr.io/open-webui/open-webui:v0.9.0
    ports:
      - "3000:8080"
    environment:
      - OPENAI_API_BASE_URL=http://api:8080/v1
      - OPENAI_API_KEY=dev-key-1
    volumes:
      - webui_data:/app/backend/data
    depends_on:
      - api
    restart: unless-stopped

volumes:
  api_data:
  webui_data:
