<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}SAURON{% endblock %}</title>
    <link rel="icon" type="image/svg+xml" href="/admin/static/favicon.svg">
    <link rel="stylesheet" href="/admin/static/style.css">
    <script src="https://unpkg.com/htmx.org@1.9.12"></script>
</head>
<body>
    <nav>
        <div class="nav-brand">SAURON</div>
        <div class="nav-links">
            <a href="/admin/">Dashboard</a>
            <a href="/admin/applications">Applications</a>
            <a href="/admin/documents">Documents</a>
            <a href="/admin/queue">Queue</a>
            <a href="/admin/categories">Categories</a>
            <a href="/admin/proposals">Proposals</a>
            <a href="/admin/playground">Playground</a>
            <a href="/admin/knowledge-graph">Knowledge Graph</a>
            <a href="/admin/audit">Audit Log</a>
            <a href="/admin/settings">Settings</a>
            <a href="/admin/logout" style="color:#fca5a5;">Logout</a>
            <button class="theme-toggle" onclick="toggleTheme()" title="Toggle theme">🌓</button>
        </div>
    </nav>
    <main>{% block content %}{% endblock %}</main>
    <script>
    function toggleTheme() {
        const current = document.documentElement.getAttribute('data-theme');
        const next = current === 'dark' ? 'light' : 'dark';
        document.documentElement.setAttribute('data-theme', next);
        localStorage.setItem('sauron-theme', next);
    }
    // Apply saved theme on load
    (function() {
        const saved = localStorage.getItem('sauron-theme') ||
            (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
        if (saved === 'dark') document.documentElement.setAttribute('data-theme', 'dark');
    })();
    </script>
</body>
</html>
