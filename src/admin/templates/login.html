<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - SAURON</title>
    <link rel="icon" type="image/svg+xml" href="/admin/static/favicon.svg">
    <link rel="stylesheet" href="/admin/static/style.css">
    <style>
        .login-container { max-width: 400px; margin: 100px auto; padding: 2rem; }
        .login-card { background: white; border-radius: 8px; padding: 2rem; box-shadow: 0 2px 8px rgba(0,0,0,0.15); }
        .login-card h1 { text-align: center; margin-bottom: 0.5rem; }
        .login-card p { text-align: center; color: #6b7280; font-size: 0.9rem; margin-bottom: 1.5rem; }
        .login-card .form-group { margin-bottom: 1rem; }
        .login-card label { display: block; margin-bottom: 0.25rem; font-weight: 600; font-size: 0.9rem; }
        .login-card input { width: 100%; padding: 0.5rem 0.75rem; border: 1px solid #d1d5db; border-radius: 4px; font-size: 0.95rem; }
        .login-card button { width: 100%; padding: 0.6rem; margin-top: 0.5rem; }
        .login-error { color: #dc2626; text-align: center; font-size: 0.9rem; margin-bottom: 1rem; }
    </style>
</head>
<body>
    <div class="login-container">
        <div class="login-card">
            <h1>SAURON</h1>
            <p>Structured Agentic Unified Retrieval Over Networks</p>
            {% if error %}
            <div class="login-error">{{ error }}</div>
            {% endif %}
            <form method="post" action="/admin/login">
                <div class="form-group">
                    <label for="username">Username</label>
                    <input type="text" id="username" name="username" autofocus required>
                </div>
                <div class="form-group">
                    <label for="password">Password</label>
                    <input type="password" id="password" name="password" required>
                </div>
                <button type="submit">Sign In</button>
            </form>
        </div>
    </div>
</body>
</html>
