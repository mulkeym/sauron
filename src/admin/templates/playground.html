{% extends "base.html" %}
{% block title %}Playground - SAURON{% endblock %}
{% block content %}
<script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
<h1>Query Playground</h1>

<div class="settings-section">
    <div class="form-group">
        <label for="play_user">Act as user</label>
        <select id="play_user" name="play_user">
            <option value="finance,executives">Mike (Finance, Executives)</option>
            <option value="it_support,devops">Bob (IT Support, DevOps)</option>
            <option value="engineering">Sarah (Engineering)</option>
            <option value="finance,it_support,engineering,executives,compliance">Alice (All Groups)</option>
        </select>
    </div>
    <div class="form-group">
        <label for="play_app">Dataset</label>
        <select id="play_app" name="app_id">
            <option value="">All Datasets</option>
            {% for app in datasets %}
            <option value="{{ app.id }}">{{ app.name }}</option>
            {% endfor %}
        </select>
    </div>
    <div class="form-group">
        <label for="play_question">Question</label>
        <textarea id="play_question" name="question" rows="3" placeholder="What is the expense policy?" style="width:100%; max-width:700px; padding:0.5rem 0.75rem; border:1px solid #d1d5db; border-radius:4px; font-size:0.9rem; font-family:inherit;"></textarea>
    </div>
    <div class="form-group">
        <label for="play_mode">Search Mode</label>
        <select id="play_mode" name="mode">
            <option value="full">Full Pipeline (vector + graph)</option>
            <option value="graph_only">Knowledge Graph Only (LightRAG)</option>
            <option value="vector_only">Vector Search Only (LanceDB)</option>
        </select>
    </div>
    <div class="form-group">
        <label><input type="checkbox" id="play_skip_cache" value="true"> Skip cache</label>
    </div>
    <button type="button" id="ask-btn" onclick="runQuery()">Ask</button>
</div>

<div id="play-progress" style="margin-top: 1.5rem; display: none;"></div>
<div id="play-results" style="margin-top: 1rem;"></div>

<script>
const STEPS = [
    {id: "cache_check", label: "Check Cache", num: 1},
    {id: "classify", label: "Classify Query", num: 2},
    {id: "structured_lookup", label: "Structured Lookup", num: 3},
    {id: "retrieve", label: "Retrieve Documents", num: 3},
    {id: "enrich", label: "Knowledge Graph", num: 3},
    {id: "synthesize", label: "Generate Answer", num: 4},
];

/* ---------- Initial full render (called once at query start) ---------- */
function initProgressPanel() {
    let html = '<div class="trace-panel"><div class="trace-steps" id="trace-steps">';
    for (const step of STEPS) {
        const conditional = step.id === 'structured_lookup';
        const hidden = conditional ? ' display:none;' : '';
        const attrs = conditional ? ' data-conditional="1"' : '';
        html += `<div id="step-row-${step.id}" class="trace-step"${attrs} style="opacity:0.4;${hidden}">
            <span id="step-icon-${step.id}">&#11036;</span>
            <span> Step ${step.num} of 4: ${step.label}</span>
            <span id="step-arrow-${step.id}" style="display:none;"> &#9660;</span>
            <span class="trace-time" id="step-time-${step.id}"></span>
        </div>
        <div id="step-detail-${step.id}" class="trace-detail"></div>`;
    }
    html += '</div></div>';
    return html;
}

/* ---------- Targeted update: mark a step as completed with drill-down ---------- */
function markStepCompleted(stepId, time, detail) {
    const row = document.getElementById(`step-row-${stepId}`);
    if (!row || row.dataset.done) return; // already marked
    row.dataset.done = '1';
    row.style = '';
    row.style.cursor = 'pointer';
    row.onclick = () => document.getElementById(`step-detail-${stepId}`).classList.toggle('expanded');
    document.getElementById(`step-icon-${stepId}`).innerHTML = '&#9989;';
    document.getElementById(`step-arrow-${stepId}`).style.display = '';
    document.getElementById(`step-time-${stepId}`).textContent = time + 's';
    const detailEl = document.getElementById(`step-detail-${stepId}`);
    if (detailEl && detail) detailEl.innerHTML = detail;
}

/* ---------- Targeted update: mark a step as active (running) ---------- */
function markStepActive(stepId, elapsed) {
    const row = document.getElementById(`step-row-${stepId}`);
    if (!row || row.dataset.done) return;
    row.style = 'background:#1e40af; color:white;';
    document.getElementById(`step-icon-${stepId}`).innerHTML = '&#9203;';
    document.getElementById(`step-time-${stepId}`).textContent = elapsed + 's';
}

/* ---------- Targeted update: only update the active step's elapsed timer ---------- */
function updateActiveTimer(stepId, elapsed) {
    const timeEl = document.getElementById(`step-time-${stepId}`);
    if (timeEl) timeEl.textContent = elapsed + 's';
}

/* ---------- Reset a step back to pending (in case active step changes) ---------- */
function markStepPending(stepId) {
    const row = document.getElementById(`step-row-${stepId}`);
    if (!row || row.dataset.done) return;
    row.style = row.dataset.conditional ? 'opacity:0.4; display:none;' : 'opacity:0.4;';
    row.onclick = null;
    document.getElementById(`step-icon-${stepId}`).innerHTML = '&#11036;';
    document.getElementById(`step-time-${stepId}`).textContent = '';
}

async function runQuery() {
    const question = document.getElementById('play_question').value;
    if (!question.trim()) return;

    const user = document.getElementById('play_user').value;
    const btn = document.getElementById('ask-btn');
    const progress = document.getElementById('play-progress');
    const results = document.getElementById('play-results');

    btn.disabled = true;
    btn.textContent = 'Working...';
    results.innerHTML = '';
    progress.style.display = 'block';
    progress.innerHTML = initProgressPanel();
    markStepActive('classify', '0');

    const startTime = Date.now();
    let queryId;
    let renderedStepCount = 0;
    const stepStartTimes = { classify: Date.now() };  // per-step start times

    try {
        const startResp = await fetch('/admin/api/playground/start', {
            method: 'POST',
            headers: {'Content-Type': 'application/x-www-form-urlencoded'},
            body: `question=${encodeURIComponent(question)}&play_user=${encodeURIComponent(user)}&mode=${document.getElementById('play_mode').value}&app_id=${document.getElementById('play_app').value || 0}&skip_cache=${document.getElementById('play_skip_cache').checked}`,
        });
        const startData = await startResp.json();
        queryId = startData.query_id;

        let done = false;
        let streaming = false;
        while (!done) {
            await new Promise(r => setTimeout(r, 500));
            const elapsed = ((Date.now() - startTime) / 1000).toFixed(1);

            const statusResp = await fetch(`/admin/api/playground/status/${queryId}`);
            const status = await statusResp.json();

            // Render any newly completed steps (without touching already-rendered ones)
            const completed = status.completed_steps || [];
            const doneSet = new Set(completed.map(s => s.step));
            while (renderedStepCount < completed.length) {
                const cs = completed[renderedStepCount];
                markStepCompleted(cs.step, cs.time, cs.detail);
                renderedStepCount++;
            }

            if (status.step === 'streaming' && !streaming) {
                streaming = true;
                // Mark all non-completed steps as pending, then activate synthesize
                for (const step of STEPS) {
                    if (step.id !== 'synthesize') markStepPending(step.id);
                }
                stepStartTimes['synthesize'] = Date.now();
                markStepActive('synthesize', '0');
                results.innerHTML = `<div class="result-card"><div class="result-meta">Groups: ${user}</div><div class="result-answer" id="stream-output"><span class="streaming-cursor">&#9610;</span></div></div>`;

                const evtSource = new EventSource(`/admin/api/playground/stream/${queryId}`);
                const outputDiv = document.getElementById('stream-output');
                let fullText = '';

                evtSource.onmessage = function(e) {
                    const data = JSON.parse(e.data);
                    if (data.token) {
                        fullText += data.token;
                        if (typeof marked !== 'undefined') {
                            outputDiv.innerHTML = marked.parse(fullText) + '<span class="streaming-cursor">&#9610;</span>';
                        } else {
                            outputDiv.textContent = fullText;
                        }
                    }
                    if (data.done) {
                        evtSource.close();
                        if (typeof marked !== 'undefined') {
                            outputDiv.innerHTML = marked.parse(data.answer || fullText);
                        } else {
                            outputDiv.textContent = data.answer || fullText;
                        }
                    }
                    if (data.error) {
                        evtSource.close();
                        outputDiv.innerHTML = `<div class="status-err">${data.error}</div>`;
                    }
                };
                evtSource.onerror = function() { evtSource.close(); };
            } else if (status.step === 'complete') {
                done = true;
                progress.style.display = 'none';
                const currentAnswer = document.getElementById('stream-output');
                if (currentAnswer) {
                    const temp = document.createElement('div');
                    temp.innerHTML = status.result_html;
                    const trace = temp.querySelector('.trace-panel');
                    const citationsEl = temp.querySelector('h3');
                    let citationsHtml = '';
                    if (citationsEl) {
                        let node = citationsEl;
                        while (node) {
                            citationsHtml += node.outerHTML;
                            node = node.nextElementSibling;
                        }
                    }
                    results.innerHTML = `${trace ? trace.outerHTML : ''}
                        <div class="result-card">
                            <div class="result-meta">Groups: ${user}</div>
                            <div class="result-answer">${currentAnswer.innerHTML}</div>
                            ${citationsHtml}
                        </div>`;
                } else {
                    results.innerHTML = status.result_html;
                    const answerDiv = results.querySelector('.result-answer');
                    if (answerDiv && typeof marked !== 'undefined') {
                        answerDiv.innerHTML = marked.parse(answerDiv.textContent);
                    }
                }
            } else if (status.step === 'error') {
                done = true;
                progress.style.display = 'none';
                results.innerHTML = `<div class="status-err">${status.error}</div>`;
            } else if (!streaming) {
                // Infer active steps from completed_steps — more robust than relying on backend step field.
                // After classify completes, retrieve + enrich run in parallel; after both, synthesize runs.
                const activeSteps = [];
                for (const step of STEPS) {
                    if (doneSet.has(step.id)) continue;  // already completed
                    // A step is active if all its predecessors are done
                    if (step.id === 'cache_check' || step.id === 'classify') {
                        // Sequential: active if prior step done (or first step)
                        activeSteps.push(step.id);
                        break;
                    } else if (step.id === 'retrieve' || step.id === 'enrich') {
                        // Parallel: both active once classify is done
                        if (doneSet.has('classify')) activeSteps.push(step.id);
                    } else if (step.id === 'synthesize') {
                        // Active once both retrieve and enrich are done
                        if (doneSet.has('retrieve') && doneSet.has('enrich')) activeSteps.push(step.id);
                    }
                }

                // Update UI: activate new steps, deactivate old ones
                const activeSet = new Set(activeSteps);
                for (const step of STEPS) {
                    if (doneSet.has(step.id)) continue;
                    if (activeSet.has(step.id)) {
                        if (!stepStartTimes[step.id]) stepStartTimes[step.id] = Date.now();
                        const stepElapsed = ((Date.now() - stepStartTimes[step.id]) / 1000).toFixed(1);
                        markStepActive(step.id, stepElapsed);
                    } else {
                        markStepPending(step.id);
                    }
                }
            }
        }
    } catch (e) {
        progress.style.display = 'none';
        results.innerHTML = `<div class="status-err">Error: ${e.message}</div>`;
    }

    btn.disabled = false;
    btn.textContent = 'Ask';
}
</script>
{% endblock %}
