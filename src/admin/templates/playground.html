{% extends "base.html" %}
{% block title %}Playground - SAURON{% endblock %}
{% block content %}
<script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
<h1>Query Playground</h1>

<div class="settings-section">
    <div class="form-group">
        <label for="play_user">Act as user</label>
        <select id="play_user" name="play_user">
            <option value="finance,executives">Mike (Finance, Executives)</option>
            <option value="it_support,devops">Bob (IT Support, DevOps)</option>
            <option value="engineering">Sarah (Engineering)</option>
            <option value="finance,it_support,engineering,executives,compliance">Alice (All Groups)</option>
        </select>
    </div>
    <div class="form-group">
        <label for="play_question">Question</label>
        <textarea id="play_question" name="question" rows="3" placeholder="What is the expense policy?" style="width:100%; max-width:700px; padding:0.5rem 0.75rem; border:1px solid #d1d5db; border-radius:4px; font-size:0.9rem; font-family:inherit;"></textarea>
    </div>
    <div class="form-group">
        <label for="play_mode">Search Mode</label>
        <select id="play_mode" name="mode">
            <option value="full">Full Pipeline (vector + graph)</option>
            <option value="graph_only">Knowledge Graph Only (LightRAG)</option>
            <option value="vector_only">Vector Search Only (LanceDB)</option>
        </select>
    </div>
    <button type="button" id="ask-btn" onclick="runQuery()">Ask</button>
</div>

<div id="play-progress" style="margin-top: 1.5rem; display: none;"></div>
<div id="play-results" style="margin-top: 1rem;"></div>

<script>
const STEPS = [
    {id: "classify", label: "Classify Query", num: 1},
    {id: "retrieve", label: "Retrieve Documents", num: 2},
    {id: "enrich", label: "Knowledge Graph Enrichment", num: 3},
    {id: "synthesize", label: "Generate Answer", num: 4},
];

function buildProgressHTML(currentStep, elapsed) {
    let html = '<div class="trace-panel"><div class="trace-steps">';
    for (const step of STEPS) {
        let icon, cls;
        if (step.id === currentStep) {
            icon = '⏳';
            cls = 'style="background:#1e40af; color:white;"';
        } else if (getStepNum(currentStep) > step.num) {
            icon = '✅';
            cls = '';
        } else {
            icon = '⬜';
            cls = 'style="opacity:0.4;"';
        }
        html += `<div class="trace-step" ${cls}>
            <span>${icon} Step ${step.num} of 4: ${step.label}</span>
            ${step.id === currentStep ? '<span class="trace-time">' + elapsed + 's</span>' : ''}
        </div>`;
    }
    html += '</div></div>';
    return html;
}

function getStepNum(stepId) {
    const s = STEPS.find(s => s.id === stepId);
    return s ? s.num : 0;
}

async function runQuery() {
    const question = document.getElementById('play_question').value;
    if (!question.trim()) return;

    const user = document.getElementById('play_user').value;
    const btn = document.getElementById('ask-btn');
    const progress = document.getElementById('play-progress');
    const results = document.getElementById('play-results');

    btn.disabled = true;
    btn.textContent = 'Working...';
    results.innerHTML = '';
    progress.style.display = 'block';
    progress.innerHTML = buildProgressHTML('classify', '0');

    // Start the query and poll for status
    const startTime = Date.now();
    let queryId;

    try {
        // Start async query
        const startResp = await fetch('/admin/api/playground/start', {
            method: 'POST',
            headers: {'Content-Type': 'application/x-www-form-urlencoded'},
            body: `question=${encodeURIComponent(question)}&play_user=${encodeURIComponent(user)}&mode=${document.getElementById('play_mode').value}`,
        });
        const startData = await startResp.json();
        queryId = startData.query_id;

        // Poll for progress, then stream the answer
        let done = false;
        let streaming = false;
        while (!done) {
            await new Promise(r => setTimeout(r, 500));
            const elapsed = ((Date.now() - startTime) / 1000).toFixed(1);

            const statusResp = await fetch(`/admin/api/playground/status/${queryId}`);
            const status = await statusResp.json();

            if (status.step === 'streaming' && !streaming) {
                // Start streaming the answer via SSE
                streaming = true;
                progress.innerHTML = buildProgressHTML('synthesize', elapsed);
                results.innerHTML = `<div class="result-card"><div class="result-meta">Groups: ${user}</div><div class="result-answer" id="stream-output"><span class="streaming-cursor">▊</span></div></div>`;

                const evtSource = new EventSource(`/admin/api/playground/stream/${queryId}`);
                const outputDiv = document.getElementById('stream-output');
                let fullText = '';

                evtSource.onmessage = function(e) {
                    const data = JSON.parse(e.data);
                    if (data.token) {
                        fullText += data.token;
                        if (typeof marked !== 'undefined') {
                            outputDiv.innerHTML = marked.parse(fullText) + '<span class="streaming-cursor">▊</span>';
                        } else {
                            outputDiv.textContent = fullText;
                        }
                    }
                    if (data.done) {
                        evtSource.close();
                        if (typeof marked !== 'undefined') {
                            outputDiv.innerHTML = marked.parse(data.answer || fullText);
                        } else {
                            outputDiv.textContent = data.answer || fullText;
                        }
                        // Continue polling for final result with citations
                    }
                    if (data.error) {
                        evtSource.close();
                        outputDiv.innerHTML = `<div class="status-err">${data.error}</div>`;
                    }
                };
                evtSource.onerror = function() { evtSource.close(); };
            } else if (status.step === 'complete') {
                done = true;
                progress.style.display = 'none';
                // Keep streamed answer but add trace + citations from final result
                const currentAnswer = document.getElementById('stream-output');
                if (currentAnswer) {
                    // Extract trace and citations from result_html, keep our streamed answer
                    const temp = document.createElement('div');
                    temp.innerHTML = status.result_html;
                    const trace = temp.querySelector('.trace-panel');
                    const citationsEl = temp.querySelector('h3');
                    let citationsHtml = '';
                    if (citationsEl) {
                        let node = citationsEl;
                        while (node) {
                            citationsHtml += node.outerHTML;
                            node = node.nextElementSibling;
                        }
                    }
                    results.innerHTML = `${trace ? trace.outerHTML : ''}
                        <div class="result-card">
                            <div class="result-meta">Groups: ${user}</div>
                            <div class="result-answer">${currentAnswer.innerHTML}</div>
                            ${citationsHtml}
                        </div>`;
                } else {
                    results.innerHTML = status.result_html;
                    const answerDiv = results.querySelector('.result-answer');
                    if (answerDiv && typeof marked !== 'undefined') {
                        answerDiv.innerHTML = marked.parse(answerDiv.textContent);
                    }
                }
            } else if (status.step === 'error') {
                done = true;
                progress.style.display = 'none';
                results.innerHTML = `<div class="status-err">${status.error}</div>`;
            } else if (!streaming) {
                progress.innerHTML = buildProgressHTML(status.step, elapsed);
            }
        }
    } catch (e) {
        progress.style.display = 'none';
        results.innerHTML = `<div class="status-err">Error: ${e.message}</div>`;
    }

    btn.disabled = false;
    btn.textContent = 'Ask';
}
</script>
{% endblock %}
